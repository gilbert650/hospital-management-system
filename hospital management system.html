<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f1f5f9;
}

/* HEADER */
header{
    background:#0f766e;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    font-size:36px;
}

/* NAVIGATION */
nav{
    background:#115e59;
    display:flex;
    justify-content:center;
    gap:20px;
    padding:15px;
    flex-wrap:wrap;
}

nav button{
    background:#f59e0b;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer;
}

/* CONTAINER */
.container{
    padding:20px;
}

/* DASHBOARD */
.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.card h2{
    color:#0f766e;
}

.number{
    font-size:40px;
    color:#f59e0b;
    margin-top:10px;
}

/* FORM */
.form-section{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.form-section h2{
    color:#0f766e;
    margin-bottom:15px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

.submit-btn{
    background:#0f766e;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

table th{
    background:#0f766e;
    color:white;
    padding:12px;
}

table td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

.status-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

/* FOOTER */
footer{
    background:#0f766e;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}
</style>
</head>
<body>

<header>
    <h1>🏥 Hospital Management System</h1>
    <p>Patient, Doctor & Appointment Management</p>
</header>

<nav>
    <button onclick="showPatients()">Patients</button>
    <button onclick="showDoctors()">Doctors</button>
    <button onclick="showAppointments()">Appointments</button>
    <button onclick="showReports()">Reports</button>
</nav>

<div class="container">

    <!-- DASHBOARD -->
    <div class="dashboard">

        <div class="card">
            <h2>Total Patients</h2>
            <div class="number" id="totalPatients">0</div>
        </div>

        <div class="card">
            <h2>Total Doctors</h2>
            <div class="number" id="totalDoctors">10</div>
        </div>

        <div class="card">
            <h2>Appointments</h2>
            <div class="number" id="appointments">0</div>
        </div>

        <div class="card">
            <h2>Discharged</h2>
            <div class="number" id="discharged">0</div>
        </div>

    </div>

    <!-- FORM -->
    <div class="form-section">

        <h2>Register Patient</h2>

        <input type="text" id="patientName" placeholder="Patient Name">

        <input type="number" id="patientAge" placeholder="Age">

        <select id="patientGender">
            <option>Male</option>
            <option>Female</option>
        </select>

        <input type="text" id="doctorName" placeholder="Doctor Name">

        <input type="date" id="appointmentDate">

        <textarea id="disease" placeholder="Disease / Diagnosis"></textarea>

        <button class="submit-btn" onclick="addPatient()">
            Register Patient
        </button>

    </div>

    <!-- TABLE -->
    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Patient</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Doctor</th>
                <th>Appointment</th>
                <th>Disease</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="patientTable"></tbody>

    </table>

</div>

<footer>
    Hospital Management System Using HTML, CSS, JavaScript, Node.js & SQL
</footer>

<script>

/*
========================================================
MYSQL DATABASE
========================================================

CREATE DATABASE hospital_management;

USE hospital_management;

CREATE TABLE patients(
    id INT AUTO_INCREMENT PRIMARY KEY,
    patient_name VARCHAR(100),
    age INT,
    gender VARCHAR(20),
    doctor_name VARCHAR(100),
    appointment_date DATE,
    disease TEXT,
    status VARCHAR(50)
);

========================================================
NODE.JS SERVER
========================================================

const express = require("express");
const mysql = require("mysql2");

const app = express();

app.use(express.json());

const db = mysql.createConnection({
    host:"localhost",
    user:"root",
    password:"",
    database:"hospital_management"
});

db.connect();

app.post("/add-patient",(req,res)=>{

    const data = req.body;

    db.query(
        "INSERT INTO patients(patient_name,age,gender,doctor_name,appointment_date,disease,status) VALUES(?,?,?,?,?,?,?)",
        [
            data.patient_name,
            data.age,
            data.gender,
            data.doctor_name,
            data.appointment_date,
            data.disease,
            "ADMITTED"
        ],
        (err,result)=>{
            if(err) throw err;

            res.send("Patient added successfully");
        }
    );
});

app.listen(3000);

========================================================
*/

// FRONTEND SYSTEM

let patients = [];

let dischargedPatients = 0;

const patientTable =
document.getElementById("patientTable");

// UPDATE DASHBOARD
function updateDashboard(){

    document.getElementById("totalPatients")
    .innerText = patients.length;

    document.getElementById("appointments")
    .innerText = patients.length;

    document.getElementById("discharged")
    .innerText = dischargedPatients;
}

// ADD PATIENT
function addPatient(){

    const patientName =
    document.getElementById("patientName").value;

    const patientAge =
    document.getElementById("patientAge").value;

    const patientGender =
    document.getElementById("patientGender").value;

    const doctorName =
    document.getElementById("doctorName").value;

    const appointmentDate =
    document.getElementById("appointmentDate").value;

    const disease =
    document.getElementById("disease").value;

    if(
        !patientName ||
        !patientAge ||
        !doctorName ||
        !appointmentDate ||
        !disease
    ){
        alert("Please fill all fields");
        return;
    }

    const patient = {
        id: Date.now(),
        patientName,
        patientAge,
        patientGender,
        doctorName,
        appointmentDate,
        disease,
        status:"ADMITTED"
    };

    patients.push(patient);

    renderPatients();

    updateDashboard();

    clearForm();

    alert("Patient registered successfully!");
}

// DISPLAY PATIENTS
function renderPatients(){

    patientTable.innerHTML = "";

    patients.forEach((patient,index)=>{

        patientTable.innerHTML += `
        <tr>

            <td>${patient.id}</td>

            <td>${patient.patientName}</td>

            <td>${patient.patientAge}</td>

            <td>${patient.patientGender}</td>

            <td>${patient.doctorName}</td>

            <td>${patient.appointmentDate}</td>

            <td>${patient.disease}</td>

            <td>${patient.status}</td>

            <td>

                <button class="status-btn"
                onclick="toggleStatus(${index})">

                    ${patient.status === "ADMITTED"
                        ? "Discharge"
                        : "Admit"}

                </button>

                <button class="delete-btn"
                onclick="deletePatient(${index})">
                    Delete
                </button>

            </td>

        </tr>
        `;
    });
}

// CHANGE STATUS
function toggleStatus(index){

    if(patients[index].status === "ADMITTED"){

        patients[index].status = "DISCHARGED";

        dischargedPatients++;

    }else{

        patients[index].status = "ADMITTED";
    }

    renderPatients();

    updateDashboard();
}

// DELETE PATIENT
function deletePatient(index){

    patients.splice(index,1);

    renderPatients();

    updateDashboard();
}

// CLEAR FORM
function clearForm(){

    document.getElementById("patientName").value = "";

    document.getElementById("patientAge").value = "";

    document.getElementById("doctorName").value = "";

    document.getElementById("appointmentDate").value = "";

    document.getElementById("disease").value = "";
}

// NAVIGATION DEMO
function showPatients(){
    alert("Viewing Patients");
}

function showDoctors(){
    alert("Viewing Doctors");
}

function showAppointments(){
    alert("Viewing Appointments");
}

function showReports(){
    alert("Viewing Reports");
}

// INITIAL LOAD
updateDashboard();

</script>

</body>
</html>
